<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 1000"
    width="1000"
    height="1000">

  <defs>
    <!-- Pumpkin gradient -->
    <linearGradient id="pumpkinGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="50%" stop-color="#ff6500"/>
      <stop offset="100%" stop-color="#ef4300"/>
    </linearGradient>

    <!-- Pumpkin side shading -->
    <linearGradient id="sideGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94400"/>
      <stop offset="50%" stop-color="#ff7200"/>
      <stop offset="100%" stop-color="#ef4800"/>
    </linearGradient>

    <!-- Green stem -->
    <linearGradient id="stemGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#157b0b"/>
      <stop offset="55%" stop-color="#36ad18"/>
      <stop offset="100%" stop-color="#73d83b"/>
    </linearGradient>

    <!-- Glow -->
    <linearGradient id="glowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff32a"/>
      <stop offset="60%" stop-color="#ffc400"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>

